    textarea {

    button {

      padding: 10px;
      border: none;
      border-radius: 6px;
      background-color: #25D366;
      color: white;

  <script>
    function buildSegment(from, to) {
      if (from && to) {
        return `מ${from} עד ${to}`;
      }
      return "";
    }

    function generateMessage() {
      const northSegments = [
        buildSegment(
          document.getElementById("n1_from").value,
          document.getElementById("n1_to").value
        ),
        buildSegment(
          document.getElementById("n2_from").value,
          document.getElementById("n2_to").value
        )
      ].filter(Boolean).join(", ");

      const southSegments = [
        buildSegment(
          document.getElementById("s1_from").value,
          document.getElementById("s1_to").value
        ),
        buildSegment(
          document.getElementById("s2_from").value,
          document.getElementById("s2_to").value
        )
      ].filter(Boolean).join(", ");

      const message = `לצפון: ${northSegments || "התנועה זורמת"}
לדרום: ${southSegments || "התנועה זורמת"}`;

      document.getElementById("output").value = message;
    }

    function copyMessage() {
      const text = document.getElementById("output").value;
      navigator.clipboard.writeText(text);
      alert("ההודעה הועתקה");
    }
