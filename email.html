<!DOCTYPE html>
<html lang="he">
<head>
  <meta charset="UTF-8">
  <title>מחולל מייל</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      direction: rtl;
      background: #f5f5f5;
      margin: 0;
      padding: 20px;
    }

    .wrapper {
      max-width: 900px;
      margin-bottom: 20px;
      margin: 0 auto;
      background: white;
      padding: 20px 24px;
      border-radius: 10px;
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.08);
    }

    h2 {
      text-align: center;
    }

    .container {
  display: flex;
  gap: 24px;
}

.container > div:first-child {
  flex: 1;
}

.container > div:last-child {
  flex: 1.4;
}

    .column {
      flex: 1;
    }

    label {
      display: block;
      margin-top: 10px;
      font-weight: bold;
      font-size: 14px;
    }

    input, textarea {
      width: 100%;
      box-sizing: border-box;
      padding: 8px;
      border: 1px solid #ccc;
      border-radius: 6px;
      font-size: 14px;
      font-family: Arial, sans-serif;
    }

    textarea {
      resize: none;
    }

    #subject { height: 60px; }
    #output { height: 350px; }

    button {
      width: 100%;
      margin-top: 10px;
      padding: 10px;
      border: none;
      border-radius: 6px;
      background: #1f6feb;
      color: white;
      cursor: pointer;
      font-size: 22px;
    }

    button.secondary {
      background: #475569;
      padding: 6px 10px;
      font-size: 22px;
      width: auto;
    }

    button.create-mail {
      background: #1f6feb;
      padding: 6px 10px;
      font-size: 22px;
      width: 240px;
    }

    button.clear-all {
      background: #b4b4b4;
      padding: 6px 10px;
      font-size: 22px;
      width: auto;
    }

    .recipients {
      margin-bottom: 15px;
      padding: 10px;
      border: 1px solid #ddd;
      border-radius: 6px;
      background: #fafafa;
    }

    .recipients div {
      background: #f0f0f0;
      padding: 8px;
      border-radius: 6px;
      font-size: 13px;
      margin-top: 4px;
      word-break: break-all;
    }

    .small-button {
      margin-top: 6px;
      padding: 8px;
    }

      .section {
      margin-top: 40px;
    }

  button:active {
    background: #1e40af; /* darker blue */
    transform: scale(0.97);
  }

  .body-mail {
   line-height: 1.5;
  }

.copy-row {
  display: grid;
  grid-template-columns: 1fr 140px;
  gap: 8px;
  align-items: start;
  direction: rtl;
}


.copy-row input,
.copy-row textarea {
  width: 100%;
  direction: rtl;
}

.copy-row .copy-btn {
  width: 90px;
  height: 36px;
  padding: 4px;
  font-size: 12px;
  line-height: 1;
  white-space: nowrap;
  overflow: hidden;

  display: flex;
  align-items: center;
  justify-content: center;

  justify-self: start;
}
    
  </style>
</head>
<body>

<div class="wrapper">

  <div class="container">
    
    <!-- LEFT -->
    <div class="column">

<div class="field" style="display:flex; align-items:center; gap:12px; margin-top:15px;">

  <label style="font-weight:bold;">
    מגיש הפנייה:
  </label>

  <label style="display:inline-flex; align-items:center;">
    <input type="radio" name="gender" value="male" checked>
    אדון
  </label>

  <label style="display:inline-flex; align-items:center;">
    <input type="radio" name="gender" value="female">
    גברת
  </label>

</div>

      
      <div class="section">
      </div>

      <label>שם</label>
      <input id="name">

      <label>טלפון</label>
      <input id="phone">

      <label>אימייל</label>
      <input id="email">

      <label>מקום האירוע</label>
      <input id="place">

      <label>תאריך האירוע</label>
      <input id="eventDate"  type="date">

      <label>תאריך הפנייה</label>
      <input id="requestDate" type="date">

     <h2></h2>
      
      <button class="create-mail" onclick="generateEmail()">צור מייל</button>

      <button type="button" class="clear-all" onclick="clearFields(this)">נקה הכל</button>
      
    </div>

    <!-- RIGHT -->
    <div class="column">


       <div class="recipients">
         
        <label>נמענים</label>
         <div class="copy-row">
           <button class="copy-btn" onclick="copyRecipients()">העתק נמענים</button>
        <div id="toEmails">פניות הציבור, בקרה, יוני קרבונרה, אווה יהודאי</div>
        
        </div>
      </div>

      <label>נושא</label>
      <div class="copy-row">
        <button class="copy-btn" onclick="copySubject()">העתק נושא</button>
      <textarea id="subject"></textarea>
      
      </div>
      <label>גוף המייל</label>
      <div class="copy-row">
        <button class="copy-btn" onclick="copyBody()">העתק גוף</button>
      <textarea class="body-mail" id="output"></textarea>
      
      </div>
    </div>

  </div>
</div>

<script>
function generateEmail() {
  const selectedGender = document.querySelector('input[name="gender"]:checked');
  const gender = selectedGender ? selectedGender.value : "male";
  const name = document.getElementById("name").value;
  const phone = document.getElementById("phone").value;
  const email = document.getElementById("email").value;
  const place = document.getElementById("place").value;
  const eventDate = formatDate(document.getElementById('eventDate').value);
  const requestDate = formatDate(document.getElementById('requestDate').value);

  let applicantText = "";

  if (gender === "female") {
    applicantText = "התקבלה שיחה לחדר הבקרה מאזרחית שטוענת שלא קיבלה מענה לפנייתה";
  } else {
    applicantText = "התקבלה שיחה לחדר הבקרה מאזרח שטוען שלא קיבל מענה לפנייתו";
  }

  const subjectText = `פניית ציבור ללא מענה - ${name || "ללא שם"} `;
  
  const bodyText = `שלום רב,

${applicantText}

שם: ${name}
מס' טלפון: ${phone}
אימייל: ${email}
מקום האירוע: ${place}
תאריך האירוע: ${eventDate}
תאריך הפנייה: ${requestDate}

אשמח לטיפולכם`;

  document.getElementById("subject").value = subjectText;
  document.getElementById("output").value = bodyText;
}
function copySubject() {
  copyText(document.getElementById("subject").value, "הנושא הועתק");
}

function copyBody() {
  copyText(document.getElementById("output").value, "הגוף הועתק");
}

function copyRecipients() {
  const to = "peniyot@ayalonhw.co.il; Bakara@ayalonhw.co.il; evay@ayalonhw.co.il; yonica@ayalonhw.co.il";
  copyText(to, "הנמענים הועתקו");
}

function copyText(text, msg) {
  if (navigator.clipboard && window.isSecureContext) {
    navigator.clipboard.writeText(text)
      
      .catch(() => fallbackCopy(text, msg));
  } else {
    fallbackCopy(text, msg);
  }
}

function fallbackCopy(text, msg) {
  const temp = document.createElement("textarea");
  temp.value = text;
  document.body.appendChild(temp);
  temp.select();
  document.execCommand("copy");
  document.body.removeChild(temp);
  alert(msg);
}

function formatDate(value) {
  if (!value) return '';
  const [year, month, day] = value.split('-');
  return `${day}/${month}/${year}`;
}

function clearFields(button) {
  // Clear all input fields
  document.getElementById('name').value = '';
  document.getElementById('phone').value = '';
  document.getElementById('email').value = '';
  document.getElementById('place').value = '';
  document.getElementById('eventDate').value = '';
  document.getElementById('requestDate').value = '';

  // Clear outputs
  document.getElementById('subject').value = '';
  document.getElementById('output').value = '';

  // Optional: visual feedback
  flashButton(button);
}
</script>

</body>
</html>
